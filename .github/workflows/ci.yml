name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Secret scan (content)
        run: pnpm secrets:scan

      # Phase 2 exit gate: build, typecheck, lint and tests all pass on every PR.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

  e2e:
    name: E2E crash recovery (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Phase 3 exit gate: work survives a real reload, tab crash and browser crash.
      - name: E2E
        run: pnpm e2e

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Static export: every page, llms.txt and the search index must build.
      # The landing page runs the real packages, so build them first.
      - name: Build packages
        run: pnpm build

      - name: Build docs
        run: pnpm --filter @resumora/docs build

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action reads the PR's commit list; without this it fails with
      # "Resource not accessible by integration" (403).
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs the whole history, not just the tip commit.
          fetch-depth: 0

      # Layer 3 of docs/security/PRE_COMMIT_VERIFICATION.md.
      # Unlike secretlint, gitleaks is extension-agnostic — it catches the
      # .env.production class of file that secretlint silently skips.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
