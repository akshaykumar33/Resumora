name: Feature Request
description: Propose a new capability or architectural improvement for Resumora.
title: '[Feat]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or developer ergonomics you would like.
    validations:
      required: true
