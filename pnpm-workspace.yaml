packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 10 blocks dependency build scripts by default. Lefthook needs its
# postinstall to place the git-hook binary, so it is explicitly allowed.
# Add entries here only after checking why the script is needed.
onlyBuiltDependencies:
  - lefthook

# esbuild (via tsup) runs from its per-platform binary package; its postinstall only
# re-checks that binary, so it is not needed and stays blocked.
ignoredBuiltDependencies:
  - esbuild
